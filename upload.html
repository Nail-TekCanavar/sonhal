
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yüklenen Görsele Göre Karakter Üret</title>
  <link rel="stylesheet" href="upload-style.css">
</head>
<body>
  <div class="container">
    <h2>Yüklenen Görsele Göre Karakter Üret</h2>
    <p><b>Görsel (jpg/png):</b></p>
    <input type="file" id="fileInput" accept="image/*"><br><br>

    <p><b>Açıklama / Poz / Tema:</b></p>
    <textarea id="description" placeholder="örn: utangaç, oturuyor, beyaz iç çamaşırı..." rows="3" style="width:100%;"></textarea><br><br>

    <button onclick="previewImage()">Önizle</button>
    <button onclick="saveCharacterImage()">AI ile Görsel Üret</button>

    <div id="previewArea" style="margin-top: 1rem;">
      <p><b>Önizleme:</b></p>
      <img id="preview" src="" alt="Seçilen görsel burada görünür" style="max-width:100%;">
    </div>
  </div>
  <script src="upload-script.js"></script>
</body>
</html>
